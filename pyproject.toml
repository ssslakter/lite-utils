[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name="lite-utils"
version = "0.0.10"
dependencies = [
    "cosette",
    "toolslm",
    "litellm",
    "diskcache",
    "tqdm",
    "aiolimiter",
    "backoff",
]


[tool.setuptools]
packages = ["lite_utils"]
